[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncmesh"
version = "0.1.0"
description = "Offline-first operation-based inventory synchronization."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<7", "hypothesis>=6.112,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]
nlp = ["scikit-learn>=1.5,<2"]
vision = ["opencv-contrib-python-headless>=4.10,<5", "Pillow>=10,<13", "qrcode>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"syncmesh.node.storage" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=syncmesh --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
mypy_path = "src"

